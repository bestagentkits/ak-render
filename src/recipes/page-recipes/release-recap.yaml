# summary: Release highlights, numbers, changed files, a test summary, upgrade notes and what comes next.
# use-cases: release notes page; sprint or milestone recap; changelog for stakeholders
version: 1
meta:
  title: Replace with the product and version — release recap
  description: Replace with the release in one line.
theme:
  preset: editorial
blocks:
  - type: hero
    eyebrow: Release · Replace with the version
    title: Replace with the theme of this release
    description: Replace with who benefits and what changes for them.
