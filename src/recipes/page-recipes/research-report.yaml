# summary: Abstract, study facts in a sidebar, findings with a chart and breakdown, methods, limits and references.
# use-cases: research write-up; experiment or A/B test report; literature or market review
version: 1
meta:
  title: Replace with the study title
  description: Replace with the research question in one line.
theme:
  preset: research-notebook
datasets:
  samples:
    - { group: Control, effort: 2, score: 61 }
    - { group: Control, effort: 4, score: 64 }
    - { group: Control, effort: 6, score: 70 }
    - { group: Control, effort: 8, score: 72 }
    - { group: Treatment, effort: 2, score: 66 }
    - { group: Treatment, effort: 4, score: 73 }
    - { group: Treatment, effort: 6, score: 81 }
    - { group: Treatment, effort: 8, score: 86 }
blocks:
  - type: hero
    eyebrow: Research report
    title: Replace with the main finding as a sentence
    description: Replace with the question, the sample and the method in one line.
  - type: sidebar-layout
    sidebar:
      - type: key-value
        title: Study
        items:
          - { key: Sample, value: n = 240 }
          - { key: Period, value: Jan–Mar 2026 }
          - { key: Method, value: Randomised trial }
    blocks:
      - type: rich-text
        text: |-
          Replace with the abstract: why the question matters and what was already known.

          Replace with the headline result and how confident you are in it.
      - type: callout
        tone: success
        title: Key finding
        text: Replace with the finding a reader should remember.
      - type: chart
        kind: scatter
        title: Score by effort
        dataRef: samples
        x: { field: effort, label: Effort (hours) }
        y: { field: score, label: Score }
        series: { field: group }
      - type: metric-breakdown
        title: Where the time went
        unit: h
        parts:
          - { label: Replace with phase A, value: 12 }
          - { label: Replace with phase B, value: 7 }
          - { label: Replace with phase C, value: 3 }
      - type: accordion
        items:
          - { title: Method, text: Replace with how participants were chosen and measured. }
          - { title: Limitations, text: Replace with what could bias the result. }
  - type: references
    title: References
    items:
      - { id: '1', title: Replace with a cited source, authors: Replace with authors, source: Replace with a venue, year: 2025 }
