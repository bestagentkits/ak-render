# summary: Broadsheet front page: masthead, section nav, lead and secondary stories, a diary rail and community buzz.
# use-cases: daily news digest; editorial front page; curated link journal; press-style briefing
version: 1
meta:
  title: Replace with the publication name
  description: Replace with one line on what this edition covers.
theme:
  preset: newspaper
policy:
  network: deny
blocks:
  - type: publication-header
    name: Replace with the publication name
    date: '2026-01-01'
    issue: No. 1
    tagline: Replace with a one-line tagline
    sections:
      - Technology
      - Business
      - Culture
  - type: editorial-layout
    lead:
      - type: story
        prominence: lead
        category: Replace with a section
        title: Replace with the lead headline
        byline: Replace with a byline
        summary: Replace with a one-sentence standfirst.
        body: |
          Replace with the opening paragraph of the lead story.

          Blank lines split paragraphs.
    secondary:
      - type: story
        category: Replace with a section
        title: Replace with a second story headline
        summary: Replace with a short summary.
    aside:
      - type: digest-list
        title: Diary
        items:
          - { date: '2026-01-01', title: Replace with an item, text: Replace with one line. }
  - type: section
    title: Community buzz
    blocks:
      - type: social-feed
        posts:
          - platform: x
            url: '#replace-with-the-post-url'
            author: { name: Replace with the author, handle: replace }
            text: Replace with the post text, as supplied.
            date: '2026-01-01'
            metrics: { views: 0, likes: 0 }
