<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AK Render: a page compiled from a spec. Blueprint palette from the landing theme. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162438"/>
      <stop offset="1" stop-color="#0a101b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6aa9e9" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4fd7"/>
      <stop offset="1" stop-color="#6aa9e9"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#grid)"/>
  <!-- the page, with a folded corner -->
  <g filter="url(#lift)">
    <path d="M132 92h178l70 70v234a24 24 0 0 1-24 24H132a24 24 0 0 1-24-24V116a24 24 0 0 1 24-24z" fill="#fffefb"/>
    <path d="M310 92v46a24 24 0 0 0 24 24h46z" fill="#ebe8e0"/>
  </g>
  <!-- hero bar, a heading line, then a two-column block row -->
  <rect x="140" y="132" width="146" height="58" rx="12" fill="url(#hero)"/>
  <rect x="140" y="214" width="208" height="16" rx="8" fill="#0d1421"/>
  <rect x="140" y="244" width="156" height="12" rx="6" fill="#0d1421" fill-opacity=".35"/>
  <rect x="140" y="280" width="98" height="104" rx="12" fill="#1d4fd7" fill-opacity=".14"/>
  <rect x="250" y="280" width="98" height="104" rx="12" fill="#1d4fd7" fill-opacity=".14"/>
  <rect x="156" y="300" width="50" height="10" rx="5" fill="#1d4fd7"/>
  <rect x="266" y="300" width="64" height="10" rx="5" fill="#1d4fd7"/>
  <rect x="156" y="322" width="66" height="8" rx="4" fill="#0d1421" fill-opacity=".3"/>
  <rect x="266" y="322" width="50" height="8" rx="4" fill="#0d1421" fill-opacity=".3"/>
</svg>
