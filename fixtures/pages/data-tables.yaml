blocks:
  - type: hero
    eyebrow: Data tables
    title: Benchmark runs
    description: One dataset, typed columns, sorting on every header and search past ten rows.

  - type: data-table
    title: All runs by p95 latency
    dataRef: runs
    transform:
      sort: { by: p95, direction: asc }
    columns:
      - key: model
        label: Model
        type: link
        hrefField: url
      - key: provider
        label: Provider
      - key: tokens
        label: Tokens
        type: number
        format: compact
      - key: reduction
        label: Saving
        type: percent
      - key: cost
        label: Cost / 1M
        type: currency
        currency: USD
      - key: p95
        label: p95
        type: number
        format: duration
      - key: status
        label: Status
        type: badge
        tones: { pass: success, fail: danger, flaky: warning }
      - key: coverage
        label: Coverage
        type: progress
        format: percent
      - key: released
        label: Released
        type: date
      - key: w6
        label: Six-week trend
        type: sparkline
        fields: [w1, w2, w3, w4, w5, w6]

  - type: data-table
    title: Top five savings
    caption: The five models with the largest token savings.
    dataRef: runs
    transform:
      sort: { by: reduction, direction: desc }
      limit: 5
      select: [model, reduction, status]
    columns:
      - key: model
        label: Model
      - key: reduction
        label: Saving
        type: percentage
      - key: status
        label: Status
        type: badge

  - type: data-table
    title: Release checklist
    data:
      - step: Freeze the dataset
        owner: data
        hours: 3
      - step: Re-run the suite
        owner: eval
        hours: 6.5
      - step: Publish the report
        owner: docs
        hours: 1.25
