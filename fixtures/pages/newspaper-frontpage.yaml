    lead:
      - type: story
        prominence: lead
        category: Infrastructure
        title: The future of edge computing belongs to the teams who learn to ship small, boring, deterministic things
        source: Technology desk
        byline: Staff reporter
        meta: 128 points · 41 comments
        summary: Compact services that start in milliseconds are replacing monoliths at the network edge, and the operators running them say the trade is worth it.
        body: |
          Operators who moved their request handling out of a central region report the same pattern: latency fell first, and then the incident count followed. The savings were not the point, they say. Predictable behaviour was.

          "We stopped debugging the cloud and started debugging our own code," said one engineer, speaking about a migration that touched forty services over two quarters. Their rollout plan was deliberately dull, with one region at a time and a written rollback for every step.

          The harder lesson was about state. Anything that needed a global lock moved back to a single owner, and the edge kept only what it could rebuild from a cache in under a second. Supercalifragilisticexpialidocious-length release notes, one team joked, turned into one-line changelogs.
        href: '#technology'
      - type: story
        prominence: feature
        category: Reading list
        title: Why the long URL should never break the page
        summary: A reminder that a link such as https://example.org/archive/2026/10/12/an-exceedingly-long-path-with-no-natural-break-points-at-all-and-keeps-going wraps instead of overflowing.
        source: Standards desk

    secondary:
