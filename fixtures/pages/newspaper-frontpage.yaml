        title: Cranes at dawn on the quay
        source: Picture desk
        summary: Port operators began the autumn shift before sunrise, with the first container ship in by six.
        image: assets/press-harbour.svg
        alt: Harbour cranes silhouetted against a pale sunrise over still water.
        caption: Cranes line the quay as the morning shift begins.
        credit: Chronicle archive
        body: |
          Nhân viên cảng bắt đầu ca làm việc mùa thu từ trước bình minh, khi con tàu container đầu tiên cập bến lúc sáu giờ.

          Người điều hành cho biết lịch trình đúng giờ giúp giảm chi phí chờ đợi cho cả chuỗi cung ứng.
