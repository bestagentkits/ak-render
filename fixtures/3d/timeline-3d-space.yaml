version: 1
meta:
  title: Road to orbit
state:
  milestone: apollo-11
blocks:
  - type: timeline-3d
    id: space
    summary: Twelve milestones of spaceflight from Sputnik to the James Webb Space Telescope, laid out in order along a path you can fly through.
    bind: state.milestone
    milestones:
      - { id: sputnik, date: 1957-10-04, label: Sputnik 1, tone: info, description: The first artificial satellite beeps its way around the Earth. }
      - { id: vostok, date: 1961-04-12, label: Vostok 1, tone: info, description: Yuri Gagarin becomes the first human to orbit the Earth. }
      - { id: voskhod, date: 1965-03-18, label: First spacewalk, tone: info, description: Alexei Leonov leaves Voskhod 2 for twelve minutes outside. }
      - { id: apollo-11, date: 1969-07-20, label: Apollo 11, tone: warning, description: Neil Armstrong and Buzz Aldrin land on the Moon. }
      - { id: salyut, date: 1971-04-19, label: Salyut 1, tone: accent, description: The first space station reaches orbit. }
      - { id: voyager, date: 1977-09-05, label: Voyager 1, tone: accent, description: "A probe leaves for Jupiter, Saturn and beyond." }
      - { id: sts-1, date: 1981-04-12, label: STS-1 Columbia, tone: accent, description: The first Space Shuttle flies to orbit and lands on a runway. }
      - { id: hubble, date: 1990-04-24, label: Hubble, tone: success, description: A space telescope launches above the blur of the atmosphere. }
      - { id: zarya, date: 1998-11-20, label: Zarya, tone: success, description: The first module of the International Space Station launches. }
      - { id: interstellar, date: 2012-08-25, label: Interstellar space, tone: success, description: Voyager 1 crosses the heliopause into interstellar space. }
      - { id: falcon, date: 2015-12-21, label: Booster lands, tone: danger, description: An orbital-class rocket booster lands upright for the first time. }
      - { id: jwst, date: 2021-12-25, label: James Webb, tone: danger, description: The largest space telescope yet launches toward L2. }
  - type: select
    id: milestone-pick
    label: Milestone
    bind: state.milestone
    options:
      - { value: sputnik, label: Sputnik 1 }
      - { value: apollo-11, label: Apollo 11 }
      - { value: hubble, label: Hubble }
      - { value: jwst, label: James Webb }
