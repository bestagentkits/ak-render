name: Cloud renderer deploy

# Manual only. The cloud renderer is an opt-in surface, so a deployment is a
# deliberate act rather than a side effect of merging a change to apps/cloud.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to Workers Scripts + Workers Routes (zone
#                          agentkit.best) + R2 + KV + Browser Rendering
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the bucket and namespace
# Optional:
#   AK_RENDER_SMOKE_TOKEN  an AgentKit bearer with an active entitlement. Without
#                          it the smoke test checks only the unauthenticated
#                          surface and says so.
#
# Nothing here compiles or publishes the package; the npm release lives in
# release.yml.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate and build the Worker without deploying
        type: boolean
        default: true
      smoke-only:
        description: Skip the deploy and only run the live smoke test
        type: boolean
        default: false
      base-url:
        description: Endpoint the live smoke test runs against
        type: string
        default: https://render.agentkit.best

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.0

jobs:
  deploy:
    name: Deploy the cloud renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Worker bundles the compiler from this repository, so the type and
      # unit gates have to pass before anything ships.
      - run: pnpm typecheck
        if: ${{ inputs.smoke-only == false }}
      - run: pnpm build
        if: ${{ inputs.smoke-only == false }}
      - run: pnpm test
        if: ${{ inputs.smoke-only == false }}

      - name: Validate the Worker bundle
        if: ${{ inputs.smoke-only == false }}
        working-directory: apps/cloud
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/worker-dry-run

      - name: Deploy
        if: ${{ inputs.dry-run == false && inputs.smoke-only == false }}
        working-directory: apps/cloud
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # MCP initialize, tools/list and catalog; render refused without a
      # bearer; with the smoke token, MCP and REST render with identical bytes,
      # a valid HTML artifact, the share lifecycle, and screenshot plus PDF
      # through the Browser Run binding.
      - name: Live smoke test
        if: ${{ inputs.dry-run == false || inputs.smoke-only == true }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice title=Cloud smoke::AK_RENDER_SMOKE_TOKEN is not set; authenticated render, share and export checks are skipped"
          fi
          node scripts/cloud-smoke.mjs
        env:
          BASE_URL: ${{ inputs.base-url }}
          TOKEN: ${{ secrets.AK_RENDER_SMOKE_TOKEN }}
          EXPECT_EXPORT: '1'
