name: Agent A/B benchmark

# Live-model runs cost money and vary between runs, so this never runs on push
# or pull request. Dispatch it by hand; it uploads the report as a build
# artifact and never commits. Without a model API key secret the harness says
# it skipped and the job still succeeds, with nothing measured.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [openrouter, anthropic, openai]
        default: openrouter
      model:
        description: Model id for the provider (e.g. anthropic/claude-haiku-5.5 on OpenRouter)
        required: true
      reps:
        description: Repetitions per task and arm
        default: '3'
        required: true

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.0

jobs:
  agent-ab:
    name: Live-model A/B
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Run the harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          REPS: ${{ inputs.reps }}
        run: >-
          node benchmarks/agent-ab-harness.mjs --provider "$PROVIDER" --model "$MODEL" --reps "$REPS" --visual
          --out-dir agent-ab-report
      - uses: actions/upload-artifact@v4
        with:
          name: agent-ab-report
          path: agent-ab-report/
          if-no-files-found: ignore
