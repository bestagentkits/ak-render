  - type: section
    id: themes
    title: Ten presets, light and dark
    blocks:
      - type: text
        variant: lead
        text: A theme is typed data, never CSS. Pick a preset, or extend one with validated tokens and component recipes; every preset ships both schemes and its fonts inside the file.
      - type: card-grid
        items:
          - title: blueprint
            text: Technical drawing with cool slate surfaces and monospace labels. Set in Geist.
          - title: editorial
            text: Serif headlines, generous whitespace, deep navy with gold. Set in Fraunces.
          - title: paper-ink
            text: Warm cream paper with terracotta and sage. Set in Bricolage Grotesque.
          - title: terminal-mono
            text: Near-black terminal with green and amber, monospace throughout. Set in JetBrains Mono.
          - title: swiss-clean
            text: Neutral high-contrast grid with one red accent. Set in Inter Tight.
          - title: warm-signal
            text: Warm neutral surfaces signalling with amber and emerald. Set in Plus Jakarta Sans.
          - title: data-console
            text: Dense operations console with a cyan accent, ledger tables and quiet charts. Set in Geist and JetBrains Mono.
          - title: executive-report
            text: White and ink with a navy accent, headline metrics and outlined cards. Set in Inter Tight.
          - title: product-studio
            text: Soft neutral surfaces, a violet accent, framed media and raised cards. Set in Plus Jakarta Sans.
          - title: research-notebook
            text: Paper with an oxblood accent, serif reading type, ledger tables and outlined notes. Set in Fraunces.
      - type: before-after
        title: One spec, two color schemes
        before:
          src: assets/shot-explain-light.webp
          alt: The explain gallery page in light mode
          label: Light
        after:
          src: assets/shot-explain-dark.webp
          alt: The explain gallery page in dark mode
          label: Dark
        start: 50
        caption: Drag the divider, or focus it and use the arrow keys. Both images are screenshots of the same compiled file.

  - type: section
    id: use
    title: Use it in three steps
    blocks:
      - type: steps
        items:
          - title: Write a spec
            text: Describe the page in YAML or JSON. Blocks carry meaning, such as hero, steps, timeline, chart or comparison; there is no field for HTML, CSS or script.
          - title: Validate
            text: Diagnostics name the JSON path to fix, so an agent repairs a spec in one more turn instead of rereading a page.
          - title: Compile and open
            text: One HTML file that opens from disk, offline, in light and dark, and reads the same in print and in a screenshot.
      - type: code
        language: yaml
        title: plan.yaml
        text: |-
          version: 1
          meta:
            title: Migration plan
          theme:
            preset: editorial
          blocks:
            - type: hero
              eyebrow: Plan
              title: Migration plan
              description: Move the public API to the new gateway without downtime.
            - type: section
              title: Steps
              blocks:
                - type: steps
                  items:
                    - title: Mirror traffic
                      text: Send a copy of production requests to the new gateway.
                    - title: Switch reads
                      text: Route read endpoints once error rates match.
            - type: callout
              tone: info
              title: Rollback
              text: Point DNS back to the old gateway; no data migrates.
      - type: code
        language: bash
        title: Validate, compile, open
        text: |-
          npx -y @bestagentkits/render validate plan.yaml
          npx -y @bestagentkits/render plan.yaml --out plan.html
          open plan.html

  - type: section
    id: install
    title: Give your agent the skill
    blocks:
      - type: text
        variant: lead
        text: The ak-render skill teaches an agent the whole loop, from catalog to compiled file. Install it with the skills CLI for any agent, or as a plugin that also registers the MCP server.
      - type: code
        language: bash
        title: Any agent, with the skills CLI
        text: npx skills add bestagentkits/ak-render
      - type: code
        language: bash
        title: Claude Code plugin
        text: |-
          claude plugin marketplace add bestagentkits/ak-render
          claude plugin install ak-render@ak-render
      - type: code
        language: bash
        title: Codex and ChatGPT plugin
        text: |-
          codex plugin marketplace add bestagentkits/ak-render
          codex plugin add ak-render@ak-render
      - type: text
        text: 'ak-render mcp serves the same loop over stdio as MCP tools: catalog, search-catalog, describe, recipes, recipe, validate, render and themes. The render tool writes the file and returns only a summary, so the page never enters the context.'
      - type: code
        language: json
        title: MCP client configuration
        text: |-
          {
            "mcpServers": {
              "ak-render": {
                "command": "npx",
                "args": ["-y", "@bestagentkits/render", "mcp"]
              }
            }
          }

