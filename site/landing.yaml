# The public landing page for AK Render, compiled by AK Render itself.
#
# Every figure below was measured from this repository with the built CLI
# (see scripts/build-site.mjs); every image is a screenshot or element crop of
# a compiled gallery page. Re-measure after a compiler change that moves bytes.
version: 1

meta:
  title: AK Render · HTML pages for coding agents, from a short Page Spec
  description: Coding agents describe a page in a short YAML or JSON Page Spec. AK Render compiles it into one deterministic, offline, self-contained HTML file.
  locale: en

theme:
  preset: blueprint

policy:
  network: deny

blocks:
  - type: hero
    eyebrow: Open source · MIT · @bestagentkits/render
    title: Your agent writes YAML. The compiler ships HTML.
    description: Describe a page in a short YAML or JSON Page Spec. AK Render compiles it into one deterministic, offline, self-contained HTML file, so your agent stops spending tokens on raw HTML, CSS and JavaScript.
    align: center
    src: assets/shot-explain-light.webp
    alt: The explain gallery page compiled by AK Render in the editorial theme, showing its serif title and the compile pipeline tabs
    address: explain.html

  - type: marquee
    label: What every compiled page guarantees
    speed: slow
    items:
      - One self-contained file
      - Opens from file://
      - Zero network requests by default
      - Same spec, same bytes
      - Nonce-locked styles and script
      - Embedded OFL fonts
      - Light and dark
      - Reduced-motion aware
      - Keyboard first

  - type: section
    id: why
    title: Why a compiler instead of hand-written HTML
    blocks:
      - type: text
        variant: lead
        text: An agent that writes markup pays for layout, CSS and script on every page, and gets a slightly different page every run. With AK Render the agent writes only what the page says. Presentation, accessibility and security are the compiler's job.
      - type: comparison
        left:
          label: The agent hand-writes HTML
          items:
            - Every page re-spends output tokens on layout, CSS and script
            - Two runs of the same prompt produce two different files
            - CDN fonts, chart libraries and remote images break offline
            - Dark mode, focus order and reduced motion depend on the prompt
        right:
          label: The agent writes a Page Spec
          items:
            - The explain gallery page is a 2.6 kB spec; the compiler emits the other 124.4 kB
            - The same spec and compiler version produce identical bytes and hash
            - One file that opens from disk, with fonts embedded and the network denied
            - Keyboard, reduced motion, print and the dark scheme come from the compiler

  - type: section
    id: loop
    title: The agent loop
    blocks:
      - type: steps
        items:
          - title: Find
            text: 'ak-render catalog lists all 83 block types and every action in 7,228 bytes. search-catalog ranks block types by intent words, and catalog --category lists one group.'
          - title: Describe
            text: 'ak-render describe <type...> --compact returns one line per prop for several blocks at once. The full hero contract with --json is 2,021 bytes.'
          - title: Validate
            text: 'ak-render validate <spec> --json returns diagnostics with a stable code and the JSON path to fix. Exit code 1 means fix and retry.'
          - title: Compile
            text: 'ak-render <spec> --out page.html writes the file and prints bytes, hash and runtime features. A spec path of "-" reads from stdin.'
      - type: terminal
        title: ~/plans
        lines:
          - kind: comment
            text: '# discover once'
          - kind: command
            text: ak-render catalog | head -1
          - kind: output
            text: Page Spec v1 — 83 blocks
          - kind: command
            text: ak-render describe hero --json | wc -c
          - kind: output
            text: '2021'
          - kind: comment
            text: '# a typo in the spec comes back with the path to fix'
          - kind: command
            text: ak-render validate plan.yaml
          - kind: error
            text: 'error: $.blocks[0].title: required value is missing'
          - kind: error
            text: 'error: $.blocks[0].titl: unknown property "titl" for this block'
          - kind: command
            text: ak-render validate plan.yaml
          - kind: success
            text: 'ok: plan.yaml'
          - kind: output
            text: '  blocks: 8 (nodes: 9)'
          - kind: command
            text: ak-render plan.yaml --out plan.html
          - kind: output
            text: wrote 111479 bytes to plan.html (3 runtime features, hash 12524sw1xvd176)
          - kind: comment
            text: '# same spec from stdin, same bytes'
          - kind: command
            text: cat plan.yaml | ak-render - --out again.html
          - kind: output
            text: wrote 111479 bytes to again.html (3 runtime features, hash 12524sw1xvd176)
          - kind: command
            text: cmp plan.html again.html && echo identical
          - kind: success
            text: identical

  - type: section
    id: tokens
    title: What it saves your agent
    blocks:
      - type: text
        variant: lead
        text: A hand-written page costs an agent three times. It reads presentation guidance, writes markup, CSS and script, and then carries the finished file in its context. With AK Render it reads a small catalog, writes a short spec, and gets back a one-line summary.
      - type: kpi
        items:
          - label: Presentation context
            value: −87%
            caption: 'Benchmarked with 0.1.1: 33.7k–36.6k tokens of legacy guidance against 4.4k of skill files'
          - label: Typical task, estimated
            value: −65%
            caption: 47.5k → 16.5k tokens with full contracts, 11.8k (−75%) with compact ones; 4 characters per token
          - label: Output on real pages
            value: −52%
            caption: Median projected saving over 12 HTML pages agents wrote in real projects
          - label: Compiled page in context
            value: 0 bytes
            caption: The HTML goes to disk; the agent reads a summary of under 800 characters
      - type: split
        ratio: wide-left
        blocks:
          - type: chart
            kind: bar
            title: Estimated tokens per page task, in thousands
            labels: [Guidance read, Written, Returned]
            series:
              - label: Hand-written HTML
                values: [33.7, 13.9, 0]
              - label: AK Render, full contracts
                values: [9.1, 7.2, 0.1]
              - label: AK Render, compact contracts
                values: [4.5, 7.2, 0.1]
          - type: steps
            title: Where the HTML goes
            items:
              - title: Agent
                text: Reads the catalog once and the contracts of the blocks it uses.
              - title: Page Spec
                text: Writes only what the page says, as YAML or JSON.
              - title: Compiler
                text: Writes the HTML to disk. The page never passes through the model's context.
      - type: card-grid
        title: Where the savings come from
        items:
          - title: Context
            text: The 7.2 kB catalog and per-block contracts replace pages of HTML style guidance.
          - title: Generation
            text: The agent stops writing CSS, script and markup. The median legacy page was 26% visible text.
          - title: Validation
            text: A failed check returns a stable code and the JSON path to fix, not a broken page to inspect.
          - title: Context shielding
            text: A compiled page is 111–246 kB. The summary the agent reads back is under 800 characters.
          - title: Determinism
            text: The same spec compiles to the same bytes, so a rerun gives the agent nothing new to review.
          - title: Edits
            text: A change is a line in the spec. The agent does not regenerate or re-read the page to fix a label.
      - type: callout
        tone: info
        title: Measured, estimated, and not yet measured
        text: 'Character counts are measured; tokens are estimated at 4 characters per token, with no tokenizer or live model run. The 87–88% figure comes from benchmarks/render-benchmark.mjs. The 65% task figure (75% with compact contracts) adds measured parts, and the spec size is projected from the legacy pages'' visible text. A page that is mostly prose saves little or nothing on output: one of the 12 grew by 35%. Live A/B runs, repair loops and wall time are not measured yet. Method and data: docs/artifacts/agent-token-cost.md.'

  - type: section
    id: blocks
    title: Everything a page needs, as data
    blocks:
