# The public landing page for AK Render, compiled by AK Render itself.
#
# Every figure below was measured from this repository with the built CLI
# (see scripts/build-site.mjs); every image is a screenshot or element crop of
# a compiled gallery page. Re-measure after a compiler change that moves bytes.
version: 1

meta:
  title: AK Render · HTML pages for coding agents, from a short Page Spec
  description: Coding agents describe a page in a short YAML or JSON Page Spec. AK Render compiles it into one deterministic, offline, self-contained HTML file.
  locale: en

theme:
  preset: blueprint

policy:
  network: deny

blocks:
  - type: hero
    eyebrow: Open source · MIT · @bestagentkits/render
    title: Your agent writes YAML. The compiler ships HTML.
    description: Describe a page in a short YAML or JSON Page Spec. AK Render compiles it into one deterministic, offline, self-contained HTML file, so your agent stops spending tokens on raw HTML, CSS and JavaScript.
    align: center
    src: assets/shot-explain-light.webp
    alt: The explain gallery page compiled by AK Render in the editorial theme, showing its serif title and the compile pipeline tabs
    address: explain.html

  - type: marquee
    label: What every compiled page guarantees
    speed: slow
    items:
      - One self-contained file
      - Opens from file://
      - Zero network requests by default
      - Same spec, same bytes
      - Nonce-locked styles and script
      - Embedded OFL fonts
      - Light and dark
      - Reduced-motion aware
      - Keyboard first

  - type: section
    id: why
    title: Why a compiler instead of hand-written HTML
    blocks:
      - type: text
        variant: lead
        text: An agent that writes markup pays for layout, CSS and script on every page, and gets a slightly different page every run. With AK Render the agent writes only what the page says. Presentation, accessibility and security are the compiler's job.
      - type: comparison
        left:
          label: The agent hand-writes HTML
          items:
            - Every page re-spends output tokens on layout, CSS and script
            - Two runs of the same prompt produce two different files
            - CDN fonts, chart libraries and remote images break offline
            - Dark mode, focus order and reduced motion depend on the prompt
        right:
          label: The agent writes a Page Spec
          items:
            - The explain gallery page is a 2.6 kB spec; the compiler emits the other 118.4 kB
            - The same spec and compiler version produce identical bytes and hash
            - One file that opens from disk, with fonts embedded and the network denied
            - Keyboard, reduced motion, print and the dark scheme come from the compiler

  - type: section
    id: loop
    title: The agent loop
    blocks:
      - type: steps
        items:
          - title: Catalog
            text: 'ak-render catalog lists all 54 block types and every action in 5,164 bytes. The agent reads it once per task.'
          - title: Describe
            text: 'ak-render describe <type> --json returns one contract: props, defaults, bounds, slots and actions. The hero contract is 1,766 bytes.'
          - title: Validate
            text: 'ak-render validate <spec> --json returns diagnostics with a stable code and the JSON path to fix. Exit code 1 means fix and retry.'
          - title: Compile
            text: 'ak-render <spec> --out page.html writes the file and prints bytes, hash and runtime features. A spec path of "-" reads from stdin.'
      - type: terminal
        title: ~/plans
        lines:
          - kind: comment
            text: '# discover once'
          - kind: command
            text: ak-render catalog | head -1
          - kind: output
            text: Page Spec v1 — 54 blocks
          - kind: command
            text: ak-render describe hero --json | wc -c
          - kind: output
            text: '1766'
          - kind: comment
            text: '# a typo in the spec comes back with the path to fix'
          - kind: command
            text: ak-render validate plan.yaml
          - kind: error
            text: 'error: $.blocks[0].title: required value is missing'
          - kind: error
            text: 'error: $.blocks[0].titl: unknown property "titl" for this block'
          - kind: command
            text: ak-render validate plan.yaml
          - kind: success
            text: 'ok: plan.yaml'
          - kind: output
            text: '  blocks: 4 (nodes: 5)'
          - kind: command
            text: ak-render plan.yaml --out plan.html
          - kind: output
            text: wrote 107343 bytes to plan.html (1 runtime features, hash 01wg16i1w9b1i6)
          - kind: comment
            text: '# same spec from stdin, same bytes'
          - kind: command
            text: cat plan.yaml | ak-render - --out again.html
          - kind: output
            text: wrote 107343 bytes to again.html (1 runtime features, hash 01wg16i1w9b1i6)
          - kind: command
            text: cmp plan.html again.html && echo identical
          - kind: success
            text: identical

  - type: section
    id: blocks
    title: Everything a page needs, as data
    blocks:
      - type: bento
        items:
          - title: Charts that read at a glance
            text: Bar, line, area, pie, donut, sparkline and progress, each with a data table behind it.
            eyebrow: Chart
            size: large
            src: assets/crop-chart.webp
            alt: A bar chart from the dashboard gallery page, cropped at twice the pixel density
          - title: Block types in the catalog
            value: '54'
            text: From hero and bento to terminal and CTA, including the page root.
            size: small
          - title: Built-in theme presets
            value: '6'
            text: Each with a light and a dark token set and an embedded display face.
            size: small
          - title: Diffs with intent
            text: Before and after, side by side, with the risk spelled out.
            eyebrow: Diff
            size: wide
            src: assets/crop-compare.webp
            alt: The comparison block from the diff gallery page in dark mode
          - title: Plans that track themselves
            text: Milestones, owners and status on one timeline.
            eyebrow: Plan
            size: wide
            src: assets/crop-timeline.webp
            alt: The timeline block from the plan gallery page
          - title: Diagrams without an engine
            text: Structured flows render as accessible markup.
            eyebrow: Diagram
            size: wide
            src: assets/crop-diagram.webp
            alt: The diagram block from the plan gallery page, a three-node flow
          - title: Charts follow the scheme
            text: Every chart stop recolors from theme tokens in dark mode.
            eyebrow: Theme
            size: wide
            src: assets/crop-donut.webp
            alt: A donut chart from the dashboard gallery page in dark mode
          - title: Declarative actions
            value: '12'
            text: Copy, toggle, tabs, filter, theme and download are bound in the spec. No page-authored script, no inline handler.
            eyebrow: Interaction
            size: wide

  - type: section
    id: themes
    title: Six presets, light and dark
    blocks:
      - type: text
        variant: lead
        text: A theme is typed data, never CSS. Pick a preset, or extend one with validated tokens; every preset ships both schemes and its fonts inside the file.
      - type: card-grid
        items:
          - title: blueprint
            text: Technical drawing with cool slate surfaces and monospace labels. Set in Geist.
          - title: editorial
            text: Serif headlines, generous whitespace, deep navy with gold. Set in Fraunces.
          - title: paper-ink
            text: Warm cream paper with terracotta and sage. Set in Bricolage Grotesque.
          - title: terminal-mono
            text: Near-black terminal with green and amber, monospace throughout. Set in JetBrains Mono.
          - title: swiss-clean
            text: Neutral high-contrast grid with one red accent. Set in Inter Tight.
          - title: warm-signal
            text: Warm neutral surfaces signalling with amber and emerald. Set in Plus Jakarta Sans.
      - type: before-after
        title: One spec, two color schemes
        before:
          src: assets/shot-explain-light.webp
          alt: The explain gallery page in light mode
          label: Light
        after:
          src: assets/shot-explain-dark.webp
          alt: The explain gallery page in dark mode
          label: Dark
        start: 50
        caption: Drag the divider, or focus it and use the arrow keys. Both images are screenshots of the same compiled file.

  - type: section
    id: use
    title: Use it in three steps
    blocks:
      - type: steps
        items:
          - title: Write a spec
            text: Describe the page in YAML or JSON. Blocks carry meaning, such as hero, steps, timeline, chart or comparison; there is no field for HTML, CSS or script.
          - title: Validate
            text: Diagnostics name the JSON path to fix, so an agent repairs a spec in one more turn instead of rereading a page.
          - title: Compile and open
            text: One HTML file that opens from disk, offline, in light and dark, and reads the same in print and in a screenshot.
      - type: code
        language: yaml
        title: plan.yaml
        text: |-
          version: 1
          meta:
            title: Migration plan
          theme:
            preset: editorial
          blocks:
            - type: hero
              eyebrow: Plan
              title: Migration plan
              description: Move the public API to the new gateway without downtime.
            - type: section
              title: Steps
              blocks:
                - type: steps
                  items:
                    - title: Mirror traffic
                      text: Send a copy of production requests to the new gateway.
                    - title: Switch reads
                      text: Route read endpoints once error rates match.
            - type: callout
              tone: info
              title: Rollback
              text: Point DNS back to the old gateway; no data migrates.
      - type: code
        language: bash
        title: Validate, compile, open
        text: |-
          npx -y @bestagentkits/render validate plan.yaml
          npx -y @bestagentkits/render plan.yaml --out plan.html
          open plan.html

  - type: section
    id: install
    title: Give your agent the skill
    blocks:
      - type: text
        variant: lead
        text: The ak-render skill teaches an agent the whole loop, from catalog to compiled file. Install it with the skills CLI for any agent, or as a plugin that also registers the MCP server.
      - type: code
        language: bash
        title: Any agent, with the skills CLI
        text: npx skills add bestagentkits/ak-render
      - type: code
        language: bash
        title: Claude Code plugin
        text: |-
          claude plugin marketplace add bestagentkits/ak-render
          claude plugin install ak-render@ak-render
      - type: code
        language: bash
        title: Codex and ChatGPT plugin
        text: |-
          codex plugin marketplace add bestagentkits/ak-render
          codex plugin add ak-render@ak-render
      - type: text
        text: 'ak-render mcp serves the same loop over stdio as five MCP tools: catalog, describe, validate, render and themes. The render tool writes the file and returns only a summary, so the page never enters the context.'
      - type: code
        language: json
        title: MCP client configuration
        text: |-
          {
            "mcpServers": {
              "ak-render": {
                "command": "npx",
                "args": ["-y", "@bestagentkits/render", "mcp"]
              }
            }
          }

  - type: section
    id: measured
    title: Measured in this repository
    surface: inverse
    blocks:
      - type: kpi
        items:
          - label: Catalog the agent reads once
            value: 5.2 kB
            caption: ak-render catalog prints 5,164 bytes
          - label: Spec the agent writes
            value: 2.6 kB
            caption: explain.yaml; the compiled page is 121.1 kB
          - label: Network requests on open
            value: '0'
            caption: explain.html from file:// in Chromium
          - label: Runtime dependencies
            value: '1'
            caption: yaml, for reading specs
      - type: video
        title: The gallery, recorded
        src: assets/walkthrough.webm
        poster: assets/walkthrough-poster.webp
        caption: 'A screen recording of compiled gallery pages: tabs, the theme toggle and chart hovers. Nothing in it is a mockup.'
        fallback:
          description: Screen recording of the showcase, explain and dashboard gallery pages.

  - type: cta
    eyebrow: Open source · MIT
    title: Write the spec. Ship the page.
    text: This page is a Page Spec compiled by AK Render, and so is every page in the gallery.
    actions:
      - label: Star on GitHub
        href: https://github.com/bestagentkits/ak-render
        variant: primary
      - label: Install from npm
        href: https://www.npmjs.com/package/@bestagentkits/render
      - label: Browse the gallery
        href: gallery/index.html
