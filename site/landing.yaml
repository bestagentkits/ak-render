            size: small
          - title: Built-in theme presets
            value: '10'
            text: Each with a light and a dark token set, an embedded display face and its own component recipes.
            size: small
          - title: Diffs with intent
            text: Before and after, side by side, with the risk spelled out.
            eyebrow: Diff
            size: wide
            src: assets/crop-compare.webp
            alt: The comparison block from the diff gallery page in dark mode
          - title: Plans that track themselves
            text: Milestones, owners and status on one timeline.
            eyebrow: Plan
            size: wide
            src: assets/crop-timeline.webp
            alt: The timeline block from the plan gallery page
          - title: Diagrams without an engine
            text: Structured flows render as accessible markup.
            eyebrow: Diagram
            size: wide
            src: assets/crop-diagram.webp
            alt: The diagram block from the plan gallery page, a three-node flow
          - title: Charts follow the scheme
            text: Every chart stop recolors from theme tokens in dark mode.
            eyebrow: Theme
            size: wide
            src: assets/crop-donut.webp
            alt: A donut chart from the dashboard gallery page in dark mode
          - title: Declarative actions
            value: '12'
            text: Copy, toggle, tabs, filter, theme and download are bound in the spec. No page-authored script, no inline handler.
            eyebrow: Interaction
            size: wide

